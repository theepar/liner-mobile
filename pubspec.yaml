name: liner_mobile
description: Liner — Mobile streaming client for music with synced lyrics and dynamic visuals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # HTTP & API
  dio: ^5.7.0

  # Local storage / auth
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Audio playback
  just_audio: ^0.9.41
  audio_session: ^0.1.21

  # UI enhancements
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  palette_generator: ^0.3.3+4
  animations: ^2.0.11

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
